name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and release (for example, v0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and verification tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate tag, package version, and changelog
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "$RELEASE_TAG" = "v$package_version"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          grep -Fq "## $package_version -" CHANGELOG.md
      - name: Run project checks
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          mypy src
          pytest --cov=retry_jitter_lab --cov-branch --cov-report=term-missing
      - name: Build and verify distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m build --outdir release-assets
          python -m venv /tmp/retry-jitter-release
          /tmp/retry-jitter-release/bin/python -m pip install --disable-pip-version-check release-assets/*.whl
          /tmp/retry-jitter-release/bin/retry-jitter-lab --strategy full --clients 10 --capacity 20 --end-time 8 >/dev/null
          git rev-parse HEAD > release-assets/SOURCE_COMMIT
          cd release-assets
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Retain verified assets for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Publish release from the existing tag
        shell: bash
        run: |
          set -euo pipefail
          expected_commit="$(tr -d '\r\n' < release-assets/SOURCE_COMMIT)"
          current_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$expected_commit" = "$current_commit"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "retry-jitter-lab $RELEASE_TAG"

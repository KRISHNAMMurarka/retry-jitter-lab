name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test with branch coverage
        run: pytest --cov=retry_jitter_lab --cov-branch --cov-report=term-missing
      - name: Run Python API example
        run: python examples/compare_policies.py >/dev/null
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify wheel in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/retry-jitter-wheel
          /tmp/retry-jitter-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/retry-jitter-wheel/bin/retry-jitter-lab --strategy full --clients 10 --capacity 20 --end-time 8 >/dev/null

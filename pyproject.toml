[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retry-jitter-lab"
version = "0.1.0"
description = "Deterministic retry and jitter simulations for outage-recovery experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krishnam Murarka" }]
keywords = ["backoff", "distributed-systems", "jitter", "reliability", "retry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
retry-jitter-lab = "retry_jitter_lab.cli:main"

[project.urls]
Homepage = "https://github.com/KRISHNAMMurarka/retry-jitter-lab"
Documentation = "https://github.com/KRISHNAMMurarka/retry-jitter-lab#readme"
Issues = "https://github.com/KRISHNAMMurarka/retry-jitter-lab/issues"
Source = "https://github.com/KRISHNAMMurarka/retry-jitter-lab"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
retry_jitter_lab = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["retry_jitter_lab"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["retry_jitter_lab"]
